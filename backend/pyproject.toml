[project]
name = "saler"
version = "0.1.0"
description = "通用销售获客工具（本地桌面版）— 本地 API、任务引擎与桌面壳"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pywebview>=5.1",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "httpx>=0.27",
    "selectolax>=0.3.21",
    "sse-starlette>=2.1",
    "openai>=1.50",
    "jsonschema>=4.22",
    "cryptography>=43.0",
    "keyring>=25.0",
    "argon2-cffi>=23.1",
    "loguru>=0.7.2",
    "platformdirs>=4.2",
    "aiosmtplib>=3.0",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.6",
    "pyinstaller>=6.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/saler"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# E501 行宽由 formatter 控制；B008 为 FastAPI Depends() 惯用法
ignore = ["E501", "B008"]
