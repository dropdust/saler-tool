# Alembic config. URL is resolved dynamically by alembic/env.py:
#   SALER_DB_URL env var > default sqlite:///./saler-dev.db (dev only)
# NOTE: keep this file pure ASCII - configparser reads it with the system
# locale encoding (cp1252 on Windows), non-ASCII bytes crash decoding.
[alembic]
script_location = alembic
prepend_sys_path = src
sqlalchemy.url =
