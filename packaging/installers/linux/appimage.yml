# Linux AppImage 构建配方（T140）
#
# 输入：PyInstaller onedir 产物 backend/dist/SalerTool/
# 基线：Ubuntu 22.04（WebKitGTK ≥ 2.36 / libsoup3；python3-gi 由发行版提供，不进 AppImage）
# 产出：SalerTool-<version>-x86_64.AppImage
#
# 执行（在 Ubuntu 22.04 上）：
#   bash packaging/installers/linux/appimage.yml   # 本文件即脚本（去掉注释行执行）
#
# 关键点：
# - WebKitGTK 是系统级依赖，明确声明并可检测；缺失时应用内给出安装提示（desktop/diagnostics.py）
# - AppRun 转发参数并保持退出码；数据目录走 platformdirs（~/.local/share/Saler）

set -euo pipefail

VERSION="${VERSION:-0.1.0}"
ROOT="$(cd "$(dirname "$0")/../../.." && pwd)"
DIST="$ROOT/backend/dist/SalerTool"
APPDIR="$ROOT/backend/dist/SalerTool.AppDir"

[ -d "$DIST" ] || { echo "缺少冻结产物：$DIST（先运行 pyinstaller packaging/saler.spec）"; exit 1; }

rm -rf "$APPDIR"
mkdir -p "$APPDIR/usr/bin" "$APPDIR/usr/share/applications" "$APPDIR/usr/share/icons/hicolor/256x256/apps"
cp -r "$DIST/." "$APPDIR/usr/bin/"

cat > "$APPDIR/usr/share/applications/saler.desktop" << 'EOF'
[Desktop Entry]
Type=Application
Name=销售获客工具
Comment=本地销售获客工作台
Exec=SalerTool
Icon=saler
Categories=Office;Finance;
Terminal=false
EOF

# 应用图标：仓库提供 packaging/installers/linux/saler.png 时复制；否则留空由用户补
[ -f "$ROOT/packaging/installers/linux/saler.png" ] && \
  cp "$ROOT/packaging/installers/linux/saler.png" "$APPDIR/usr/share/icons/hicolor/256x256/apps/saler.png"

cp "$APPDIR/usr/share/applications/saler.desktop" "$APPDIR/saler.desktop"
ln -sf usr/share/icons/hicolor/256x256/apps/saler.png "$APPDIR/saler.png" 2>/dev/null || true

cat > "$APPDIR/AppRun" << 'EOF'
#!/bin/sh
HERE="$(dirname "$(readlink -f "$0")")"
# WebKitGTK 自检：缺失时应用内诊断会给出安装指引
export GDK_BACKEND="${GDK_BACKEND:-x11}"
exec "$HERE/usr/bin/SalerTool" "$@"
EOF
chmod +x "$APPDIR/AppRun"

if ! command -v appimagetool >/dev/null; then
  echo "缺少 appimagetool：下载 https://github.com/AppImage/AppImageKit/releases （或 apt install appimagetool）"
  exit 1
fi
mkdir -p "$ROOT/backend/dist/installer"
ARCH=x86_64 appimagetool "$APPDIR" "$ROOT/backend/dist/installer/SalerTool-${VERSION}-x86_64.AppImage"
echo "完成：backend/dist/installer/SalerTool-${VERSION}-x86_64.AppImage"
