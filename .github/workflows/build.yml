name: Build & Release

# 三平台构建矩阵（T139→发布链路）：前端构建 → PyInstaller 冻结 → 安装器打包 → 上传产物；
# 推 v* 标签时额外创建 GitHub Release（附安装器与 SHA256SUMS），发布说明模板 packaging/release-notes.md。
# 触发：发布标签（v*）或手动。签署/公证为发布阶段步骤（T141），在 secrets 就绪前跳过
# （macOS 资产为未签名 zip，见 packaging/installers/macos/dmg-notes.md）。

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact: SalerTool-linux-x64
          - os: windows-latest
            artifact: SalerTool-windows-x64
          - os: macos-14
            artifact: SalerTool-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - uses: pnpm/action-setup@v4
        with:
          # 必须 ≥11：frontend/pnpm-workspace.yaml 为 pnpm 11 语义（仅 allowBuilds、无 packages 字段），
          # pnpm 9 会以 "packages field missing or empty" 秒退（曾致 CI 前端长期红）
          version: 11

      - uses: actions/setup-node@v4
        with:
          # 必须 ≥22.13：pnpm 11 的 engines 要求（node 20 下 pnpm 会拒绝启动、秒退）
          node-version: 22

      - name: 前端构建
        working-directory: frontend
        shell: bash
        run: |
          # 失败时把日志尾部同步打为 ::error:: 注解（公开仓库匿名可读，便于无登录诊断）
          run_step() {
            local name="$1"; shift
            if ! "$@" > "/tmp/fe-$name.log" 2>&1; then
              tail -40 "/tmp/fe-$name.log"
              tail -12 "/tmp/fe-$name.log" | while IFS= read -r line; do echo "::error::$name: $line"; done
              exit 1
            fi
          }
          node --version
          run_step install pnpm install --no-frozen-lockfile
          run_step build pnpm build
          echo "前端构建完成：$(du -sh dist | cut -f1)"

      - name: Linux 运行库（冻结前置：gi 必须可 import，随包收集 gi.so）
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi gir1.2-webkit2-4.1 python3-venv

      - name: 后端冻结（Linux：系统站点包，gi/WebKitGTK 与构建机一致）
        if: runner.os == 'Linux'
        working-directory: backend
        run: |
          uv venv .venv-frozen --python /usr/bin/python3 --system-site-packages
          UV_PROJECT_ENVIRONMENT=.venv-frozen uv sync --extra dev
          UV_PROJECT_ENVIRONMENT=.venv-frozen uv run --no-sync pyinstaller ../packaging/saler.spec --noconfirm

      - name: 后端冻结（Windows / macOS）
        if: runner.os != 'Linux'
        working-directory: backend
        run: |
          uv sync --extra dev
          uv run pyinstaller ../packaging/saler.spec --noconfirm

      - name: 冻结产物自检
        shell: bash
        run: |
          DIST="backend/dist/SalerTool"
          if [ "$RUNNER_OS" = "Windows" ]; then EXE="$DIST/SalerTool.exe"; else EXE="$DIST/SalerTool"; fi
          test -f "$EXE" || { echo "冻结产物缺失"; exit 1; }
          echo "冻结产物：$(du -sh "$DIST" || true)"

      - name: 冒烟（Linux：--server 建库/迁移/健康检查/SPA）
        if: runner.os == 'Linux'
        run: bash packaging/smoke.sh backend/dist/SalerTool/SalerTool

      - name: 打包安装器（Windows：Inno Setup）
        if: runner.os == 'Windows'
        shell: bash
        run: |
          # 失败时：stdout 打日志尾部 + Step Summary 留档 + ::error:: 注解（公开仓库匿名可读）。
          # 注解口径 tail -6：GitHub 单步骤最多保留 10 条注解，超出截断会丢掉最后的真正报错行
          diag() {
            echo "---- $1 日志尾部 ----"
            tail -40 "$2"
            { echo "### $1 失败日志（尾部）"; echo '```'; tail -25 "$2"; echo '```'; } >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
            tail -6 "$2" | while IFS= read -r line; do echo "::error::$1: $line"; done
            exit 1
          }
          ver="${GITHUB_REF_NAME#v}"
          case "$GITHUB_REF" in refs/tags/v*) ;; *) ver="0.0.0-dev" ;; esac
          echo "版本：$ver"
          mkdir -p backend/dist/installer
          command -v choco >/dev/null || { echo "::error::choco 不在 PATH"; exit 1; }
          choco install innosetup --no-progress -y > /tmp/choco.log 2>&1 || diag choco /tmp/choco.log
          ISCC="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          if [ ! -x "$ISCC" ]; then
            ls "/c/Program Files (x86)/" | while IFS= read -r line; do echo "::error::pf86: $line"; done
            exit 1
          fi
          # MSYS2_ARG_CONV_EXCL：git-bash 会把 /DMyAppVersion=… 当路径转成 D:\…（ISCC 报
          # "You may not specify more than one script filename"），对该调用禁用路径转换
          MSYS2_ARG_CONV_EXCL='*' "$ISCC" "/DMyAppVersion=$ver" packaging/installers/windows/inno.iss > /tmp/iscc.log 2>&1 || diag iscc /tmp/iscc.log
          ls -la backend/dist/installer

      - name: 打包安装器（macOS：zip，未签名）
        if: runner.os == 'macOS'
        run: |
          ver="${GITHUB_REF_NAME#v}"
          case "$GITHUB_REF" in refs/tags/v*) ;; *) ver="0.0.0-dev" ;; esac
          mkdir -p backend/dist/installer
          ditto -c -k --keepParent backend/dist/SalerTool "backend/dist/installer/SalerTool-${ver}-macos-arm64.zip"

      - name: 打包安装器（Linux：AppImage）
        if: runner.os == 'Linux'
        run: |
          ver="${GITHUB_REF_NAME#v}"
          case "$GITHUB_REF" in refs/tags/v*) ;; *) ver="0.0.0-dev" ;; esac
          curl -fsSL -o /tmp/appimagetool \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /tmp/appimagetool
          PATH="/tmp:$PATH" APPIMAGE_EXTRACT_AND_RUN=1 VERSION="$ver" \
            bash packaging/installers/linux/appimage.yml

      - name: 上传安装器
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-installer
          path: backend/dist/installer/*
          if-no-files-found: error
          retention-days: 14

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: "*-installer"
          path: release-assets
          merge-multiple: true

      - name: 生成校验和
        working-directory: release-assets
        run: |
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: 创建 GitHub Release（安装器 + SHA256SUMS）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver="${GITHUB_REF_NAME#v}"
          sed "s/{VERSION}/${ver}/g" packaging/release-notes.md > /tmp/release-notes.md
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber  # 重跑：覆盖同名资产
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "销售获客工具 ${GITHUB_REF_NAME}" \
              --notes-file /tmp/release-notes.md \
              release-assets/*
          fi
