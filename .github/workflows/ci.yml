name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - name: 安装依赖
        working-directory: backend
        run: uv sync --extra dev
      - name: 静态检查
        working-directory: backend
        run: uv run ruff check src tests
      - name: 测试
        working-directory: backend
        shell: bash
        run: |
          # 失败时把 pytest 输出同步为注解/摘要（公开仓库原始日志匿名不可读）。
          # 注解上限 10 条/步骤：优先发 FAILED 行（测试名）+ 日志尾部 3 行，共 ≤8 条
          if ! uv run pytest -q > /tmp/pytest.log 2>&1; then
            tail -60 /tmp/pytest.log
            { echo "### pytest 失败摘要"; echo '```'; grep -E "^(FAILED|ERROR)" /tmp/pytest.log | head -20; tail -10 /tmp/pytest.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
            grep -E "^(FAILED|ERROR)" /tmp/pytest.log | head -5 | while IFS= read -r line; do echo "::error::pytest: $line"; done
            tail -3 /tmp/pytest.log | while IFS= read -r line; do echo "::error::pytest(尾): $line"; done
            exit 1
          fi
          tail -3 /tmp/pytest.log

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          # 必须 ≥11：frontend/pnpm-workspace.yaml 为 pnpm 11 语义（仅 allowBuilds、无 packages 字段），
          # pnpm 9 会以 "packages field missing or empty" 秒退（曾致 CI 前端长期红）
          version: 11
      - uses: actions/setup-node@v4
        with:
          # 必须 ≥22.13：pnpm 11 的 engines 要求（node 20 下 pnpm 会拒绝启动、秒退）
          node-version: 22
      - name: 安装依赖
        working-directory: frontend
        run: pnpm install --no-frozen-lockfile
      - name: 测试
        working-directory: frontend
        run: pnpm test
      - name: 构建
        working-directory: frontend
        run: pnpm build
